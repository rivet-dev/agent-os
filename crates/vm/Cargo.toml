[package]
name = "agentos-vm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "agentOS VM orchestration, kernel composition, and execution coordination"

[features]
default = []
node-v8 = ["dep:agentos-executor-node-v8", "dep:agentos-executor-v8-runtime"]
python-v8-pyodide = [
    "dep:agentos-executor-python-v8-pyodide",
    "dep:agentos-executor-v8-runtime",
]
wasm-v8 = ["dep:agentos-executor-wasm-v8", "dep:agentos-executor-v8-runtime"]
wasm-wasmtime = ["dep:agentos-executor-wasm-wasmtime"]
wasm-wasmtime-threads = [
    "wasm-wasmtime",
    "agentos-executor-wasm-wasmtime/threads",
]
all-executors = [
    "node-v8",
    "python-v8-pyodide",
    "wasm-v8",
    "wasm-wasmtime",
    "wasm-wasmtime-threads",
]

[lib]
name = "agentos_vm"

[dependencies]
agentos-rivetkit-ars-client = { workspace = true }
agentos-vm-host-interface = { workspace = true }
agentos-executor-contract = { workspace = true }
agentos-executor-node-v8 = { workspace = true, optional = true }
agentos-executor-python-v8-pyodide = { workspace = true, optional = true }
agentos-executor-wasm-v8 = { workspace = true, optional = true }
agentos-executor-wasm-wasmtime = { workspace = true, optional = true }
agentos-vm-kernel = { workspace = true }
agentos-resource-accounting = { workspace = true }
agentos-sidecar-protocol = { workspace = true }
agentos-driver-tokio = { workspace = true }
agentos-executor-v8-runtime = { workspace = true, optional = true }
agentos-executor-wasm-abi = { workspace = true }
agentos-vm-config = { workspace = true }
agentos-vfs-storage = { workspace = true }
async-trait = "0.1"
aes = "0.8"
aes-gcm = "0.10"
aws-config = "1"
aws-credential-types = "1"
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio", "sigv4a"] }
base64 = "0.22"
bytes = "1"
ctr = "0.9"
filetime = "0.2"
getrandom = "0.2"
h2 = "0.4"
http = "1"
hmac = "0.12"
hickory-resolver = "=0.26.1"
jsonwebtoken = "9.3.1"
log = "0.4"
md-5 = "0.10"
nix = { version = "0.29", features = ["fs", "net", "poll", "process", "signal", "socket", "user"] }
# `vendored` builds OpenSSL from source → self-contained binary with no
# system-openssl discovery on any runner (ubuntu/macOS). openssl backs the
# guest crypto runtime (RSA/EC/DH/AES), so it cannot be a TLS-only stack.
openssl = { version = "0.10", features = ["vendored"] }
oxc_allocator = "0.109.0"
oxc_ast = "0.109.0"
oxc-browserslist = "=2.3.1"
oxc_codegen = "0.109.0"
oxc_parser = "0.109.0"
oxc_semantic = "0.109.0"
oxc_span = "0.109.0"
oxc_transformer = "0.109.0"
pbkdf2 = "0.12"
rustls = { version = "0.23.37", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pemfile = "2.2"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
# `rustix` provides the safe (owned-fd, no `unsafe`) `openat(2)`/`statat`/
# `readlinkat`/`Dir` primitives used by the universal resolve-beneath
# implementation in the `confine` module of `src/plugins/host_dir.rs`. Plain
# `openat(2)` is portable across Linux, macOS, and gVisor; `openat2` is
# deliberately NOT used (see that module for why).
rustix = { version = "1", features = ["fs", "net"] }
scrypt = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_bare = "0.5"
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
shlex = "1.3"
socket2 = "0.6"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
ureq = { version = "2.10", features = ["json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
agentos-vfs-core = { workspace = true }

[build-dependencies]
base64 = "=0.22.1"
webpki-root-certs = "=1.0.8"

[dev-dependencies]
agentos-executor-wasm-abi-generator = { path = "../executor-wasm-abi-generator" }
command-fds = "0.3"
tar = "0.4"
tempfile = "3"
vbare.workspace = true
wat = "1.0"
v8 = "130"
