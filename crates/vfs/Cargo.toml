[package]
name = "agentos-vfs-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Generic async virtual filesystem primitives"

# Published as `agentos-vfs-core`, but the lib is named `vfs` so the
# workspace-wide `vfs = { package = "agentos-vfs-core" }` alias and this
# crate's own `tests/*.rs` (`use vfs::...`) resolve it by that name.
[lib]
name = "vfs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
blake3 = "1"
serde = { version = "1.0", features = ["derive"] }
serde_bare = "0.5"
serde_json = "1.0"
vbare = { workspace = true }
# Drop-in std::time replacement: re-exports std on native, uses js_sys::Date /
# performance.now() on wasm32 (where std SystemTime/Instant abort).
web-time = "1.1"

[build-dependencies]
vbare-compiler = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
agentos-runtime-tokio = { workspace = true }
memmap2 = "0.9"
tar = "0.4"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
