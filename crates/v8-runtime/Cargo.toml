[package]
name = "agentos-v8-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "V8 isolate runtime for agentos guest JavaScript execution"
# The largest Pyodide artifacts are staged from the repository in workspace
# builds and intentionally omitted from crates.io packages.
exclude = [
    "assets/pyodide/pyodide.asm.wasm",
    "assets/pyodide/pyodide.asm.js",
    "assets/pyodide/python_stdlib.zip",
    "assets/pyodide/numpy-2.2.5-cp313-cp313-pyodide_2025_0_wasm32.whl",
    "assets/pyodide/pandas-2.3.3-cp313-cp313-pyodide_2025_0_wasm32.whl",
]

[features]
test-support = []

[dependencies]
agentos-bridge = { workspace = true }
agentos-executor-contract = { workspace = true }
agentos-runtime-tokio = { workspace = true }
v8 = "130"
crossbeam-channel = "0.5"
flume = { version = "0.11", features = ["async"] }
getrandom = "0.2"
signal-hook = "0.3"
libc = "0.2"
ciborium = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"

[build-dependencies]
agentos-build-support = { workspace = true }
cc = "1"

[dev-dependencies]
nix = { version = "0.29", features = ["fs"] }
tempfile = "3"

[[test]]
name = "snapshot"
required-features = ["test-support"]
