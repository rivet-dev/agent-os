[package]
name = "agentos-executor-wasm-wasmtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Wasmtime standalone WebAssembly executor for agentOS"

[features]
default = []
threads = []

[lib]
doctest = false

[dependencies]
agentos-executor-contract = { workspace = true }
agentos-runtime-tokio = { workspace = true }
agentos-wasm-common = { workspace = true }
base64 = "0.22"
ciborium = "0.2"
flume = "0.11"
nix = { version = "0.29", features = ["process", "signal", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "process", "rt", "sync", "time"] }
wasmtime = { workspace = true }

[dev-dependencies]
wat = "1"
