[package]
name = "agentos-executor-wasm-v8"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly executor hosted by the agentOS V8 runtime"

[lib]
doctest = false

[dependencies]
agentos-bridge = { workspace = true }
agentos-executor-contract = { workspace = true }
agentos-runtime-tokio = { workspace = true }
agentos-v8-runtime = { workspace = true }
agentos-wasm-common = { workspace = true }
base64 = "0.22"
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
wat = "1"
