[package]
name = "agentos-executor-python-v8-pyodide"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pyodide Python executor hosted by the agentOS V8 runtime"

[lib]
doctest = false

[dependencies]
agentos-bridge = { workspace = true }
agentos-executor-contract = { workspace = true }
agentos-runtime-tokio = { workspace = true }
agentos-v8-runtime = { workspace = true }
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
