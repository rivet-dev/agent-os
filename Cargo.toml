[workspace]
resolver = "2"
exclude = ["software"]
members = [
    "crates/rivetkit-ars-client",
    "crates/acp-protocol",
    "crates/sidecar",
    "crates/client",
    "crates/vm-host-interface",
    "crates/executor-conformance",
    "crates/executor-contract",
    "crates/executor-node-v8",
    "crates/executor-python-v8-pyodide",
    "crates/executor-wasm-abi",
    "crates/executor-wasm-v8",
    "crates/executor-wasm-wasmtime",
    "crates/vm-kernel",
    "crates/benchmark-baseline",
    "crates/vm",
    "crates/resource-accounting",
    "crates/driver-tokio",
    "crates/sidecar-client",
    "crates/sidecar-protocol",
    "crates/executor-v8-runtime",
    "crates/vfs-core",
    "crates/vfs-storage",
    "crates/vm-config",
    "crates/executor-wasm-abi-generator",
    "examples/embedded-vm",
]
[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/rivet-dev/agent-os"

# AgentOS crates are published as a lock-step chain and are self-contained in
# this workspace.
[workspace.dependencies]
agent-client-protocol-schema = "1.4.0"
agentos-rivetkit-ars-client = { path = "crates/rivetkit-ars-client", version = "0.0.1" }
agentos-vm-host-interface = { path = "crates/vm-host-interface", version = "0.0.1" }
agentos-executor-contract = { path = "crates/executor-contract", version = "0.0.1" }
agentos-executor-node-v8 = { path = "crates/executor-node-v8", version = "0.0.1" }
agentos-executor-python-v8-pyodide = { path = "crates/executor-python-v8-pyodide", version = "0.0.1" }
agentos-executor-wasm-abi = { path = "crates/executor-wasm-abi", version = "0.0.1" }
agentos-executor-wasm-v8 = { path = "crates/executor-wasm-v8", version = "0.0.1" }
agentos-executor-wasm-wasmtime = { path = "crates/executor-wasm-wasmtime", version = "0.0.1" }
agentos-vm-kernel = { path = "crates/vm-kernel", version = "0.0.1" }
agentos-benchmark-baseline = { path = "crates/benchmark-baseline", version = "0.0.1" }
agentos-vm = { path = "crates/vm", version = "0.0.1", default-features = false }
agentos-resource-accounting = { path = "crates/resource-accounting", version = "0.0.1" }
agentos-driver-tokio = { path = "crates/driver-tokio", version = "0.0.1" }
agentos-acp-protocol = { path = "crates/acp-protocol", version = "0.0.1" }
agentos-sidecar-client = { path = "crates/sidecar-client", version = "0.0.1" }
agentos-sidecar = { path = "crates/sidecar", version = "0.0.1" }
agentos-sidecar-protocol = { path = "crates/sidecar-protocol", version = "0.0.1" }
agentos-executor-v8-runtime = { path = "crates/executor-v8-runtime", version = "0.0.1" }
agentos-vfs-core = { path = "crates/vfs-core", version = "0.0.1", default-features = false }
agentos-vfs-storage = { path = "crates/vfs-storage", version = "0.0.1", default-features = false }
agentos-vm-config = { path = "crates/vm-config", version = "0.0.1" }
vbare = "0.0.4"
vbare-compiler = { package = "rivet-vbare-compiler", version = "0.0.5" }

# Keep parallel-compilation disabled: Wasmtime implements it with Rayon's
# host-sized global pool, outside AgentOS's fixed reviewed thread census.
wasmtime = { version = "=46.0.0", default-features = false, features = [
    "async",
    "cranelift",
    "gc",
    "gc-drc",
    "runtime",
    "std",
    "threads",
] }
wasmparser = "=0.251.0"

[profile.embedded]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
