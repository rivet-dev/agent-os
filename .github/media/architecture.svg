<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 700 360" role="img" aria-label="A VM split into a kernel and an executor. The kernel owns the virtual filesystem, process table, socket table, pipes, PTYs, DNS, and permission policy. The executor runs guest JavaScript, WASM, and native binaries, and reaches the kernel through syscalls.">
  <style>
    svg {
      --ink: #1b1916;
      --muted: #56524a;
      --panel: #faf8f3;
      --box: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --ink: #e6e1d7;
        --muted: #a29c92;
        --panel: #26241f;
        --box: #1c1b19;
      }
    }
    .ink { fill: var(--ink); }
    .muted { fill: var(--muted); }
    .stroke-ink { stroke: var(--ink); }
    .panel { fill: var(--panel); }
    .box { fill: var(--box); }
  </style>
  <defs>
    <marker id="vm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="ink" />
    </marker>
  </defs>
  <rect x="12" y="12" width="676" height="336" rx="14"  class="panel stroke-ink" stroke-width="1.5" />
  <text x="32" y="40" font-size="13" font-weight="600" class="ink">The VM</text>

  <rect x="32" y="56" width="636" height="150" rx="10"  class="box stroke-ink" stroke-width="1.3" />
  <text x="52" y="82" font-size="13" font-weight="600" class="ink">Kernel</text>
  <text x="52" y="100" font-size="10.5" class="muted">trusted core, every operation goes through here</text>
  <g font-size="11" class="ink">
    <rect x="52" y="116" width="118" height="30" rx="6"  class="panel stroke-ink" stroke-width="1" /><text x="111" y="135" text-anchor="middle">virtual filesystem</text>
    <rect x="182" y="116" width="118" height="30" rx="6"  class="panel stroke-ink" stroke-width="1" /><text x="241" y="135" text-anchor="middle">process table</text>
    <rect x="312" y="116" width="118" height="30" rx="6"  class="panel stroke-ink" stroke-width="1" /><text x="371" y="135" text-anchor="middle">socket table</text>
    <rect x="442" y="116" width="92" height="30" rx="6"  class="panel stroke-ink" stroke-width="1" /><text x="488" y="135" text-anchor="middle">pipes / PTYs</text>
    <rect x="546" y="116" width="100" height="30" rx="6"  class="panel stroke-ink" stroke-width="1" /><text x="596" y="135" text-anchor="middle">DNS</text>
    <rect x="52" y="156" width="594" height="30" rx="6"  class="panel stroke-ink" stroke-width="1" /><text x="349" y="175" text-anchor="middle">permission policy · network allowlist · resource limits</text>
  </g>

  <line x1="349" y1="206" x2="349" y2="244" class="stroke-ink" stroke-width="1.5" marker-end="url(#vm-arrow)" />
  <line x1="319" y1="244" x2="319" y2="206" class="stroke-ink" stroke-width="1.5" marker-end="url(#vm-arrow)" />
  <text x="430" y="228" text-anchor="middle" font-size="10" class="muted">syscalls / replies</text>

  <rect x="32" y="248" width="636" height="84" rx="10"  class="box stroke-ink" stroke-width="1.3" />
  <text x="52" y="274" font-size="13" font-weight="600" class="ink">Executor</text>
  <text x="52" y="292" font-size="10.5" class="muted">untrusted, runs guest code, holds no capabilities</text>
  <g font-size="11" class="ink">
    <rect x="382" y="262" width="170" height="30" rx="6"  class="panel stroke-ink" stroke-width="1" /><text x="467" y="281" text-anchor="middle">guest JavaScript (native V8)</text>
    <rect x="562" y="262" width="84" height="30" rx="6"  class="panel stroke-ink" stroke-width="1" /><text x="604" y="281" text-anchor="middle">WASM</text>
    <rect x="382" y="298" width="264" height="22" rx="6"  class="panel stroke-ink" stroke-width="1" /><text x="514" y="313" text-anchor="middle" font-size="10.5">shell · coreutils · npm packages · native binaries</text>
  </g>
</svg>
